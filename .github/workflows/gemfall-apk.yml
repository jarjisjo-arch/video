# Builds the Gemfall Android app (APK) and puts it on the "gemfall-latest" release so it can be downloaded and shared.
name: Build Gemfall Android app

on:
  push:
    paths:
      - 'gemfall/**'
      - 'gemfall-android/**'
      - '.github/workflows/gemfall-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gemfall-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the APK
        working-directory: gemfall-android
        env:
          VERSION_CODE: ${{ github.run_number }}
          RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/gemfall-latest
          # private Google Play upload key (repository secrets); the Play bundle stays unsigned without them
          PLAY_UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          PLAY_UPLOAD_PASSWORD: ${{ secrets.PLAY_UPLOAD_PASSWORD }}
        run: ./build-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Gemfall-apk
          path: |
            gemfall-android/Gemfall.apk
            gemfall-android/Gemfall-play*.aab
            gemfall-android/gemfall-web.zip
            gemfall-android/update.json

      - name: Publish to the gemfall-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES="Gemfall for Android, version 1.${{ github.run_number }} (built from ${GITHUB_SHA::7}). On an Android phone, download Gemfall.apk, open it and allow the install. Installing a newer version keeps your progress. Gemfall-play.aab is the bundle for uploading to Google Play Console; it can't be installed on a phone directly."
          if gh release view gemfall-latest >/dev/null 2>&1; then
            gh release edit gemfall-latest --notes "$NOTES"
          else
            gh release create gemfall-latest --title "Gemfall for Android" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          # the app and the content first, then update.json, so the manifest never points at files not uploaded yet
          gh release upload gemfall-latest gemfall-android/Gemfall.apk gemfall-android/gemfall-web.zip --clobber
          # the signed Google Play bundle, when the upload key is set up
          if [ -f gemfall-android/Gemfall-play.aab ]; then gh release upload gemfall-latest gemfall-android/Gemfall-play.aab --clobber; fi
          gh release upload gemfall-latest gemfall-android/update.json --clobber
