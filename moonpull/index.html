<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b1e">
<title>Moonpull</title>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" hidden>
  <div class="hud-tl"><div id="hearts"></div><div class="chip"><span class="ic" id="hfi"></span><b id="hf">0</b></div></div>
  <div class="hud-tc">
    <div id="track"><i id="trackfill"></i><span id="trackstorm" class="ic"></span><span id="trackboat"></span><span id="trackflag" class="ic"></span></div>
    <div id="chain"><b id="mult">×1</b><span id="dots"></span></div>
  </div>
  <div class="hud-tr"><b id="score">0</b><button id="pause" class="round" aria-label="Pause"></button></div>
  <div id="danger"></div>
</div>
<div id="hint" hidden></div>
<div id="holdtip" hidden><span class="ring"></span><b>Hold</b> to charge, let go to jump</div>
<div id="storybar" hidden><p id="storytext"></p><div><span id="storydots"></span><button data-a="skipstory">Skip</button></div></div>
<div id="photobar" hidden><button class="btn sm glass" data-a="photoshare">Share</button><button class="btn sm glass" data-a="photoback">Back</button></div>
<div id="ui"></div>
<div id="toast"></div>
<div id="rotate"><div><b>Turn your phone sideways</b><span>Moonpull is played in landscape.</span></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
